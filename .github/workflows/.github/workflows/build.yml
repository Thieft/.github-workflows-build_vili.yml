name: Build Custom ROM for Xiaomi 11T Pro (vili)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 20000
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Initialize Repo & Sync Source
        run: |
          mkdir -p ~/rom
          cd ~/rom
          repo init -u https://github.com/LineageOS/android.git -b lineage-20.0 --git-lfs
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Clone Device, Vendor & Kernel Trees
        run: |
          cd ~/rom
          git clone https://github.com/LineageOS/android_device_xiaomi_vili.git -b lineage-20.0 device/xiaomi/vili
          git clone https://github.com/The-Muppets/proprietary_vendor_xiaomi_vili.git -b lineage-20.0 vendor/xiaomi/vili
          git clone https://github.com/LineageOS/android_kernel_xiaomi_sm8350.git -b lineage-20.0 kernel/xiaomi/sm8350

      - name: Build ROM
        run: |
          cd ~/rom
          source build/envsetup.sh
          lunch lineage_vili-userdebug
          mka bacon -j$(nproc --all)

      - name: Upload Built ROM
        uses: actions/upload-artifact@v3
        with:
          name: LineageOS-vili-zip
          path: ~/rom/out/target/product/vili/*.zip
