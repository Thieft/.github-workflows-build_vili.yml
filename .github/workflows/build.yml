name: Build Ultimate Custom ROM for Xiaomi 11T Pro (vili)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      # 1. Maximize Disk Space
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 1024
          swap-size-mb: 512
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      # 2. Setup Build Tools
      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf libncurses5-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc zip zlib1g-dev git-lfs

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure Git Identity & Optimization
        run: |
          git config --global user.name "AOSP Builder"
          git config --global user.email "aosp@build.local"
          git config --global http.postBuffer 524288000

      # 3. Sync Source Code with Partial Clone Flags
      - name: Sync Source Code & Local Manifest
        run: |
          mkdir -p ~/rom && cd ~/rom
          repo init -u https://github.com/LineageOS/android.git -b lineage-21.0 --git-lfs --depth=1 --clone-filter=blob:none
          
          # Local Manifest for Vili
          mkdir -p .repo/local_manifests
          cat <<EOF > .repo/local_manifests/vili.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project path="device/xiaomi/vili" name="LineageOS/android_device_xiaomi_vili" remote="github" revision="lineage-21.0" />
            <project path="vendor/xiaomi/vili" name="The-Muppets/proprietary_vendor_xiaomi_vili" remote="github" revision="lineage-21.0" />
            <project path="kernel/xiaomi/sm8350" name="LineageOS/android_kernel_xiaomi_sm8350" remote="github" revision="lineage-21.0" />
            <project path="hardware/xiaomi" name="LineageOS/android_hardware_xiaomi" remote="github" revision="lineage-21.0" />
          </manifest>
          EOF

          # Repo Sync Command
          repo sync -c -j2 --force-sync --no-clone-bundle --no-tags

      # 4. Pre-install Apps & Banking Patch
      - name: Pre-install System Apps & Banking PlayIntegrity Spoof
        run: |
          cd ~/rom
          
          # Pre-install ViPER4AndroidFX Repackaged as Priv-App
          mkdir -p device/xiaomi/vili/prebuilt/priv-app/ViPER4AndroidFX
          curl -L -o device/xiaomi/vili/prebuilt/priv-app/ViPER4AndroidFX/ViPER4AndroidFX.apk "https://github.com/Aki007/ViPER4AndroidFX-repackaged/releases/download/v2.7.2.1/ViPER4AndroidFX-repackaged.apk" || true

          # Pre-install YouTube Morphe as System App
          mkdir -p device/xiaomi/vili/prebuilt/app/YouTube
          curl -L -o device/xiaomi/vili/prebuilt/app/YouTube/YouTube.apk "https://github.com/MorpheApp/Morphe/releases/latest/download/YouTube-Morphe.apk" || true

          # Enable Game Prop Spoofing & Banking Play Integrity Fingerprint
          echo "TARGET_ENABLE_GAME_PROPS_SPOOF := true" >> device/xiaomi/vili/BoardConfig.mk
          echo "PRODUCT_BUILD_PROP_OVERRIDES += TARGET_DEVICE=husky BUILD_FINGERPRINT=google/husky/husky:14/UD1A.230805.004/10800000:user/release-keys" >> device/xiaomi/vili/device.mk

      # 5. Build ROM
      - name: Build ROM Package (User Stealth Mode)
        run: |
          cd ~/rom
          source build/envsetup.sh
          lunch lineage_vili-user
          mka bacon -j$(nproc --all)
