name: Build Custom ROM for Xiaomi 11T Pro (vili)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf libncurses5-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc zip zlib1g-dev

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Configure Git
        run: |
          git config --global user.name "AOSP Builder"
          git config --global user.email "aosp@build.local"

      - name: Sync Source Code & Trees
        run: |
          mkdir -p ~/rom && cd ~/rom
          repo init -u https://github.com/LineageOS/android.git -b lineage-20.0 --git-lfs --depth=1
          
          # Device Tree Clone (Corrected Branch Name)
          git clone https://github.com/Evolution-X-Devices/device_xiaomi_vili.git -b thirteen device/xiaomi/vili
          
          # Vendor Tree Clone
          git clone https://github.com/Evolution-X-Devices/vendor_xiaomi_vili.git -b thirteen vendor/xiaomi/vili
          
          # Kernel Tree Clone
          git clone https://github.com/Evolution-X-Devices/kernel_xiaomi_sm8350.git -b thirteen kernel/xiaomi/sm8350

      - name: Build ROM
        run: |
          cd ~/rom
          source build/envsetup.sh
          lunch lineage_vili-userdebug || lunch evo_vili-userdebug
          mka bacon -j$(nproc --all)
